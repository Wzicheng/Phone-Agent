name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DSH_BETA_TOKEN_FILE: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gpgv ubuntu-keyring file xz-utils
      - name: Restore persistent test signing key
        env:
          KEYSTORE_B64: ${{ secrets.DSHGO_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing DSHGO_DEBUG_KEYSTORE_B64 secret'; exit 1; }
          install -d -m 700 "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Configure Android SDK
        run: |
          flutter config --no-analytics --android-sdk "$ANDROID_HOME"
          set +o pipefail
          yes | flutter doctor --android-licenses
      - name: Check generated resources
        run: |
          python3 app/tool/l10n_merge.py --check
          python3 app/tool/guide_sync.py --check
      - name: Build ARM64 runtime
        run: bash runtime/build-runtime.sh arm64-v8a
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Build parallel-install ARM64 APK
        env:
          ORG_GRADLE_PROJECT_dshGoTestInstall: 'true'
        run: bash tooling/build-apk.sh -f arm64 --keep-daemon
      - name: Test Android package contracts
        working-directory: app/android
        env:
          ORG_GRADLE_PROJECT_dshGoTestInstall: 'true'
        run: ./gradlew :app:testArm64ReleaseUnitTest --tests '*LauncherManifestTest'
      - name: Verify parallel package identity
        run: |
          AAPT=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n 1)
          "$AAPT" dump badging app/build/app/outputs/flutter-apk/app-arm64-release.apk > apk-badging.txt
          grep -q "package: name='io.github.ccch1mneyyy.dsh_app.dev'" apk-badging.txt
          grep -q "application-label:'DSH Go Dev'" apk-badging.txt
      - name: Record APK checksum and source revision
        run: |
          sha256sum app/build/app/outputs/flutter-apk/app-arm64-release.apk > apk-sha256.txt
          git rev-parse HEAD > source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-${{ github.run_number }}
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-release.apk
            apk-sha256.txt
            source-revision.txt
          if-no-files-found: error
          retention-days: 14
